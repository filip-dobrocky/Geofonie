; PlatformIO Project Configuration File
;
; Env layout (mesh OTA):
;   xiao_ota      generic image, NO OBJ_ID (id from NVS), info logs -- OTA bench artifact
;   xiao_deploy   generic image, NO OBJ_ID, CORE_DEBUG_LEVEL=0     -- production OTA artifact
;   xiao_dev_N    USB provisioning: -DOBJ_ID=N seeds the id into NVS on boot
;
; Provision each board once over USB with its xiao_dev_N env, then ship every
; later update as xiao_deploy over the mesh.
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.05/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = colorize
build_flags =
    -I../common
    -DUSE_FS_LITTLEFS
lib_deps =
    https://github.com/CNMAT/OSC.git
    https://git.iem.at/uc/osc_control.git
    MIDI Library
    painlessmesh/painlessMesh@1.5.7
    ; framework-bundled, but the chain LDF only finds them if named
    Preferences
    WebServer
    Update
    FS
    LittleFS
    bblanchon/ArduinoJson
    arkhipenko/TaskScheduler

[xiao]
board = seeed_xiao_esp32s3
; LittleFS holds the uploaded firmware.bin while a node distributes it, so the
; FS partition has to be larger than the image itself.
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
lib_ignore = ESPAsyncTCP
build_flags =
    ${env.build_flags}
    -DBOARD_XIAO

; ---- generic OTA artifacts (no OBJ_ID) ----
[env:xiao_ota]
extends = xiao
build_flags =
    ${xiao.build_flags}
    -DCORE_DEBUG_LEVEL=3

[env:xiao_deploy]
extends = xiao
build_flags =
    ${xiao.build_flags}
    -DCORE_DEBUG_LEVEL=0

; ---- USB provisioning, one per object ----
[env:xiao_dev_0]
extends = xiao
build_flags =
    ${xiao.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DOBJ_ID=0

[env:xiao_dev_1]
extends = xiao
build_flags =
    ${xiao.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DOBJ_ID=1

[env:xiao_dev_2]
extends = xiao
build_flags =
    ${xiao.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DOBJ_ID=2

[env:xiao_dev_3]
extends = xiao
build_flags =
    ${xiao.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DOBJ_ID=3

[env:xiao_dev_4]
extends = xiao
build_flags =
    ${xiao.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DOBJ_ID=4

[env:olimex]
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
lib_ignore = ESPAsyncTCP
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DBOARD_OLIMEX

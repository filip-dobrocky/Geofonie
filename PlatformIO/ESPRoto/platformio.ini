; PlatformIO Project Configuration File
;
; Env layout (mesh OTA):
;   xiao_ota      generic image, NO OBJ_ID (id from NVS), info logs -- OTA bench artifact
;   xiao_deploy   generic image, NO OBJ_ID, CORE_DEBUG_LEVEL=0     -- production OTA artifact
;   xiao_dev_N    USB provisioning: -DOBJ_ID=N seeds the id into NVS on boot
;   xiao_bench    no sensor attached; never distribute via OTA
;
; Provision each board once over USB with its xiao_dev_N env, then ship every
; later update as xiao_deploy over the mesh.
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.05/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags =
    -I../common
    -DUSE_FS_LITTLEFS
    ; Distance filtering. Drop FILTER_MEDIAN for the moving average; keep
    ; NUM_READINGS odd while median is on. 7 if it is still spiky, but that
    ; is ~72 ms of lag -- raise SENSOR_TIMING_BUDGET before going past it.
    -DFILTER_MEDIAN
    -DNUM_READINGS=5
    ; Core split: core 1 is the FlexyStepper service task's alone, so step
    ; timing never waits on the network. Everything else that is not already
    ; pinned to core 0 by the IDF config (WiFi, lwIP) moves there too: loop(),
    ; the Arduino event task, and AsyncTCP -- which painlessMesh drives at
    ; priority 10 with no affinity, i.e. straight over the stepper.
    -DARDUINO_RUNNING_CORE=0
    -DARDUINO_EVENT_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
build_unflags =
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
lib_deps =
    MIDI Library
    https://github.com/pololu/vl53l4cd-arduino
    ESP-FlexyStepper
    ESP32Servo
    https://github.com/CNMAT/OSC.git
    https://git.iem.at/uc/osc_control.git
    painlessmesh/painlessMesh@1.5.7
    bblanchon/ArduinoJson
    arkhipenko/TaskScheduler
    ; framework-bundled, but the chain LDF only finds them if named
    Preferences
    WebServer
    Update
    FS
    LittleFS

[xiao]
board = seeed_xiao_esp32s3
; LittleFS holds the uploaded firmware.bin while a node distributes it, so the
; FS partition has to be larger than the image itself.
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
lib_ignore = ESPAsyncTCP
build_flags =
    ${env.build_flags}
    -DBOARD_XIAO

; ---- generic OTA artifacts (no OBJ_ID) ----
[env:xiao_ota]
extends = xiao
build_flags =
    ${xiao.build_flags}
    -DCORE_DEBUG_LEVEL=3

[env:xiao_deploy]
extends = xiao
build_flags =
    ${xiao.build_flags}
    -DCORE_DEBUG_LEVEL=0

[env:xiao_bench]
extends = xiao
build_flags =
    ${xiao.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DNO_SENSOR=1

; ---- USB provisioning, one per object ----
[env:xiao_dev_0]
extends = xiao
build_flags =
    ${xiao.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DOBJ_ID=0

[env:xiao_dev_1]
extends = xiao
build_flags =
    ${xiao.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DOBJ_ID=1

[env:xiao_dev_2]
extends = xiao
build_flags =
    ${xiao.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DOBJ_ID=2

[env:xiao_dev_3]
extends = xiao
build_flags =
    ${xiao.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DOBJ_ID=3

[env:xiao_dev_4]
extends = xiao
build_flags =
    ${xiao.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DOBJ_ID=4

[env:olimex]
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
lib_ignore = ESPAsyncTCP
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DBOARD_OLIMEX
    -DNO_SENSOR=1

    -DSTEP_PIN=4
    -DDIR_PIN=5
    -DEN_PIN=6
    -DSERVO_PIN=7
    -DRX_PIN=8
    -DTX_PIN=9
    -DI2C_SDA=10
    -DI2C_SCL=11
    -DMS1_PIN=12
    -DMS2_PIN=13
    -DMS3_PIN=14

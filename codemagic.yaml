workflows:
  macos-controller:
    name: Controller (macOS)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: Controller
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - flutter pub get
      - flutter build macos --release
      # ponytail: unsigned build — first launch needs right-click > Open. Add code signing + notarization if it's ever distributed.
      - ditto -c -k --keepParent build/macos/Build/Products/Release/geo_controller.app "$CM_EXPORT_DIR/geo_controller-macos.zip"

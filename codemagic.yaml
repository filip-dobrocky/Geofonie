workflows:
  macos-controller:
    name: Controller (macOS)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: Controller
    environment:
      flutter: stable
      xcode: latest
      # CM_CERTIFICATE (base64 Developer ID .p12), CM_CERTIFICATE_PASSWORD,
      # APP_STORE_CONNECT_PRIVATE_KEY (.p8 contents), APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      groups:
        - apple
    scripts:
      - flutter pub get
      - flutter build macos --release
      - name: Sign with Developer ID
        script: |
          set -e
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/devid.p12
          keychain add-certificates --certificate /tmp/devid.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
          # The build machine lacks the Developer ID intermediate, so the chain to Apple's root can't be built.
          curl -fsSL -o /tmp/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security add-certificates /tmp/DeveloperIDG2CA.cer
          APP=build/macos/Build/Products/Release/geo_controller.app
          ID="Developer ID Application"
          # Inside-out: nested frameworks first, then the app with its sandbox entitlements.
          for f in "$APP"/Contents/Frameworks/*.framework "$APP"/Contents/Frameworks/*.dylib; do
            [ -e "$f" ] && codesign --force --timestamp --options runtime -s "$ID" "$f"
          done
          codesign --force --timestamp --options runtime --entitlements macos/Runner/Release.entitlements -s "$ID" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep "Authority=Developer ID Application"
      - name: Notarize
        script: |
          set -e
          APP=build/macos/Build/Products/Release/geo_controller.app
          # Rebuild the PEM: pasted secrets often lose their line breaks.
          BODY=$(echo "$APP_STORE_CONNECT_PRIVATE_KEY" | sed 's/-----[A-Z ]*-----//g' | tr -d ' \r\n\t"')
          printf -- "-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n" "$(echo "$BODY" | fold -w 64)" > /tmp/AuthKey.p8
          ditto -c -k --keepParent "$APP" /tmp/notarize.zip
          xcrun notarytool submit /tmp/notarize.zip --wait \
            --key /tmp/AuthKey.p8 --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" --issuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun stapler staple "$APP"
          ditto -c -k --keepParent "$APP" "$CM_EXPORT_DIR/geo_controller-macos.zip"
